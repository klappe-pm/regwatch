# Publish to PyPI through trusted publishing when a version tag is pushed.
# Three jobs: build checks the tag and builds the distributions, test installs the
# built wheel and runs the suite against it, and publish uploads. The publish job
# runs in the "pypi" environment, which requires an approval, and holds the only
# id-token permission. No token is stored anywhere. Every pip install uses hashes.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: tag is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git rev-parse --verify --quiet origin/main > /dev/null || { echo "origin/main was not fetched"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "tag ${TAG} is not on main"; exit 1; }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: install the build tools
        run: python -m pip install --require-hashes -r requirements/build.txt
      - name: tag matches version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -m hatchling version)"
          test "v${version}" = "${TAG}" || { echo "tag ${TAG} does not match version ${version}"; exit 1; }
      - name: build
        run: python -m build --no-isolation
      - name: checksums
        run: |
          {
            echo "### Checksums"
            echo
            echo '```text'
            sha256sum dist/*
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: install the test tools
        run: python -m pip install --require-hashes -r requirements/ci.txt
      - name: install the built wheel
        run: python -m pip install --no-deps dist/*.whl
      - name: the wheel is what gets tested
        run: |
          python -P -c 'import pathlib, regwatch; assert "site-packages" in pathlib.Path(regwatch.__file__).parts, regwatch.__file__'
      - name: test
        run: python -P -m pytest -q

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
